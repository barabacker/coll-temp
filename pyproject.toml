[project]
name = "coll"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "collector-framework",
    "certifi>=2026.7.22",
    "curl-cffi>=0.15.0",
    "parsel>=1.11.0",
    "pydantic>=2",
]

# The framework lives in its own repository; until it is published this points
# at the copy staged in this repo. Swap for a git/PyPI source after the split.
[tool.uv.sources]
collector-framework = { path = "collector-framework", editable = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
