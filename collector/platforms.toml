# Platform registry — the source of truth for which sites are parsed.
#
# Each [[platform]] becomes a registered parser class, built by
# collector/platforms.py on import. Fields:
#   key            registry key (used by get_parser / worker / CLI)   [required]
#   engine         fogsoft | kendo | btorg | ruson                    [required]
#   domain         site root, no trailing slash                       [required]
#   title          human label (becomes the class docstring)          [optional]
#   listing_path   overrides the engine's default listing path        [optional]
#   extra_ca_cert  PEM path relative to the engine package (TLS quirk)[optional]
#   skip_tls_verify  disable TLS verification (broken cert on their side) [optional]
#   enabled        false keeps the entry documented but unregistered  [optional]
#   note           why it is disabled / anything worth remembering    [optional]

